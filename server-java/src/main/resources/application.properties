# Lo schema del database e' lo stesso del backend Node: nasce da database/init/*.sql
# e non da Hibernate. `validate` fa fallire l'avvio se le entita' non combaciano, che
# e' esattamente il controllo che serve durante una riscrittura — `update` invece
# modificherebbe in silenzio uno schema condiviso con l'altro backend.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.url=${DATABASE_URL_JDBC:jdbc:postgresql://db:5432/mydb}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

server.port=${PORT:8080}
# Stesso prefisso del backend Node, cosi' il frontend non cambia una riga.
server.servlet.context-path=/api

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.backend-url=${BACKEND_URL:http://localhost:8080}
# Cartella delle foto prodotto caricate dagli admin (vedi WebConfig e
# AdminController#uploadImage). Relativa alla working directory del processo,
# come nel backend Node.
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Nessun default: un segreto scritto nel sorgente e' un segreto pubblico.
app.jwt.secret=${JWT_SECRET:}
# Sette giorni, come le sessioni del backend Node.
app.jwt.ttl-days=${JWT_TTL_DAYS:7}
# Flag Secure sul cookie di sessione. Default false perche' il progetto gira in
# HTTP (docker compose -> http://localhost:4200): acceso qui, il browser smette di
# mandare il cookie e il login non funziona piu' su nessun host che non sia
# localhost. Va messo a true insieme al reverse proxy TLS.
app.cookie.secure=${COOKIE_SECURE:false}

# Primo amministratore, creato all'avvio se entrambe sono valorizzate (vedi
# AdminBootstrap). Serve a entrare nel pannello su un'installazione nuova senza
# scrivere un hash a mano nel database. Se l'indirizzo esiste gia', la password
# NON viene toccata.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Amministratore}

# Posta: "smtp" oppure vuoto (nessun invio, solo log).
app.mail.provider=${MAIL_PROVIDER:}
app.mail.from=${MAIL_FROM:noreply@commonera.it}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Senza timeout espliciti JavaMail aspetta all'infinito e blocca la richiesta HTTP.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.it.commonera=INFO

# ─── Accedi con Google ────────────────────────────────────────────────────────
# Vuote: le rotte OAuth non vengono registrate, il frontend non mostra il bottone
# e l'applicazione parte identica a prima (vedi GoogleOAuthConfig).
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# L'indirizzo a cui Google rimanda il browser. Va registrato **identico** fra gli
# "Authorized redirect URIs" della Google Cloud Console: Spring Security confronta
# l'URL della richiesta di ritorno con questo valore carattere per carattere.
# Punta al backend e non al frontend di proposito — il proxy del frontend riscrive
# l'intestazione Host, e il confronto fallirebbe.
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:${app.backend-url}/api/auth/oauth2/callback/google}

# ─── Stripe ───────────────────────────────────────────────────────────────────
# Vuote: il checkout resta simulato e l'applicazione parte lo stesso.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Aggiornamenti di schema additivi, eseguiti **prima** che Hibernate validi:
# vedi il commento in testa a db/upgrades.sql. `always` perche' il default
# (`embedded`) salterebbe il file proprio sul Postgres vero.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/upgrades.sql
