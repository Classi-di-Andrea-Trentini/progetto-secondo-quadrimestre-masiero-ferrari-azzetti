<div
  class="fixed bottom-6 right-6 z-toast flex flex-col gap-2 pointer-events-none"
  role="status"
  aria-live="polite"
>
  @for (t of toastSvc.toasts(); track trackById($index, t)) {
    <div
      class="pointer-events-auto flex items-start gap-2.5 px-3.5 py-3 rounded-sm shadow-float text-sm font-medium max-w-xs animate-slide-in"
      [class]="containerClass(t.type)"
    >
      <svg
        class="w-4 h-4 shrink-0 mt-0.5"
        [class]="iconClass(t.type)"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconFor(t.type)" />
      </svg>
      <span class="flex-1 leading-snug">{{ t.message }}</span>
      <button
        type="button"
        (click)="remove(t.id)"
        class="shrink-0 mt-0.5 opacity-60 hover:opacity-100 transition-opacity"
        aria-label="Close notification"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
