@if (showFallback()) {
  <div class="ce-fallback" role="img" [attr.aria-label]="alt || 'Immagine non disponibile'">
    <svg class="ce-fallback-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
      <path d="M48 37V31a7 7 0 1 1 7-7" />
      <path d="M48 37 18 59a4.5 4.5 0 0 0 2.7 8.1h54.6A4.5 4.5 0 0 0 78 59L48 37Z" />
      <path d="M31 67.1h34" class="ce-fallback-rule" />
    </svg>
  </div>
} @else {
  <img
    class="ce-image"
    [src]="src"
    [alt]="alt"
    [attr.loading]="loading"
    [style.object-fit]="fit"
    [style.object-position]="position"
    (error)="onError()"
  />
}
