<nav [ngClass]="navClasses()">
  <div class="w-full px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">

      <!-- Mobile menu button -->
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <button
          type="button"
          (click)="menuOpen.update(v => !v)"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-500 hover:bg-gray-100 hover:text-black focus:outline-none transition-colors"
          [attr.aria-expanded]="menuOpen()"
        >
          <span class="sr-only">{{ menuOpen() ? 'Chiudi menu' : 'Apri menu' }}</span>
          @if (!menuOpen()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
              <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6">
              <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </button>
      </div>

      <!-- Left nav links (desktop) -->
      <div class="hidden sm:flex flex-1 items-center justify-start">
        <div class="flex shrink-0 items-center">
          <div class="flex space-x-4">
            <a routerLink="/products" routerLinkActive="underline underline-offset-2" class="px-3 py-2 text-sm font-medium text-black hover:underline underline-offset-2">Products</a>
            <a routerLink="/about" routerLinkActive="underline underline-offset-2" class="px-3 py-2 text-sm font-medium text-black hover:underline underline-offset-2">About us</a>
          </div>
        </div>
      </div>

      <!-- Logo (center) -->
      <div class="flex items-center justify-center absolute left-1/2 -translate-x-1/2">
        <a routerLink="/home" [routerLinkActiveOptions]="{exact: true}" class="transition-transform duration-300 hover:scale-110">
          <img src="commonEra.png" alt="Common Era" class="-mt-1 w-32 sm:w-60 h-auto px-4" />
        </a>
      </div>

      <!-- Right: user + cart -->
      <div class="absolute inset-y-0 right-0 flex items-center gap-4 sm:gap-8 pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
        <a routerLink="/me" class="relative flex items-center justify-center focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
          @if (initials()) {
            <span class="w-8 h-8 rounded-full bg-black text-white text-xs font-bold flex items-center justify-center tracking-wider transition-transform duration-300 hover:scale-110 select-none">
              {{ initials() }}
            </span>
          } @else {
            <i class="fa-regular fa-user transition-transform duration-300 hover:scale-110"></i>
          }
        </a>
        <button
          type="button"
          (click)="cart.toggle()"
          aria-label="Apri carrello"
          class="relative flex rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 cursor-pointer"
        >
          <i class="fa-solid fa-cart-shopping transition-transform duration-300 hover:scale-110"></i>
          @if (cart.itemCount() > 0) {
            <span class="absolute -top-2 -right-2 w-4 h-4 bg-black text-white text-[10px] font-bold rounded-full flex items-center justify-center leading-none">
              {{ cart.itemCount() > 9 ? '9+' : cart.itemCount() }}
            </span>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <div class="block sm:hidden border-t border-gray-100 bg-white">
      <div class="space-y-1 px-2 pt-2 pb-3">
        <a routerLink="/products" (click)="menuOpen.set(false)" class="block rounded-md px-3 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-black transition-colors">Products</a>
        <a routerLink="/about" (click)="menuOpen.set(false)" class="block rounded-md px-3 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-black transition-colors">About us</a>
        <a routerLink="/me" (click)="menuOpen.set(false)" class="block rounded-md px-3 py-2 text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-black transition-colors">Il mio account</a>
      </div>
    </div>
  }
</nav>
