<nav [ngClass]="navClasses()">
  <div class="px-3 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between gap-2">
      <!-- ── Sinistra: menu mobile / link desktop ─────────────────────────── -->
      <div class="flex items-center sm:flex-1">
        <button
          type="button"
          (click)="menuOpen.set(!menuOpen())"
          class="sm:hidden inline-flex items-center justify-center p-2 -ml-2 text-ink-2 hover:text-ink hover:bg-sunken rounded-sm transition-colors"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="nav-mobile-menu"
        >
          <span class="sr-only">{{ menuOpen() ? 'Chiudi menu' : 'Apri menu' }}</span>
          @if (!menuOpen()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6" aria-hidden="true">
              <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6" aria-hidden="true">
              <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </button>

        <div class="hidden sm:flex items-center gap-1">
          <a
            routerLink="/products"
            routerLinkActive="text-ink after:scale-x-100"
            class="relative px-3 py-2 text-xs font-bold uppercase tracking-[0.09em] text-ink-2 hover:text-ink transition-colors
                   after:absolute after:left-3 after:right-3 after:bottom-1 after:h-px after:bg-ink
                   after:origin-left after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
            >Collezione</a
          >
          <a
            routerLink="/about"
            routerLinkActive="text-ink after:scale-x-100"
            class="relative px-3 py-2 text-xs font-bold uppercase tracking-[0.09em] text-ink-2 hover:text-ink transition-colors
                   after:absolute after:left-3 after:right-3 after:bottom-1 after:h-px after:bg-ink
                   after:origin-left after:scale-x-0 after:transition-transform after:duration-200 hover:after:scale-x-100"
            >Chi siamo</a
          >
        </div>
      </div>

      <!-- ── Centro: logo ─────────────────────────────────────────────────── -->
      <a routerLink="/home" class="shrink-0" aria-label="Common Era — home">
        <img
          src="commonEra.png"
          alt="Common Era"
          class="h-7 sm:h-9 w-auto transition-transform duration-300 ease-out-expo hover:scale-105"
        />
      </a>

      <!-- ── Destra: admin, account, carrello ─────────────────────────────── -->
      <div class="flex items-center justify-end gap-3 sm:gap-5 sm:flex-1">
        @if (isAdmin()) {
          <a
            routerLink="/admin"
            class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-2xs font-bold uppercase tracking-[0.09em]
                   border border-line-strong text-ink-2 hover:border-ink hover:text-ink rounded-sm transition-colors"
          >
            <i class="fa-solid fa-sliders text-[0.65rem]" aria-hidden="true"></i>
            Admin
          </a>
        }

        <a
          routerLink="/me"
          class="flex items-center justify-center rounded-sm"
          [attr.aria-label]="initials() ? 'Il mio account' : 'Accedi'"
        >
          @if (initials()) {
            <span
              class="w-8 h-8 rounded-full bg-ink text-surface text-2xs font-bold flex items-center justify-center
                     tracking-wider select-none transition-transform duration-300 ease-out-expo hover:scale-110"
            >
              {{ initials() }}
            </span>
          } @else {
            <i
              class="fa-regular fa-user text-ink-2 hover:text-ink transition-all duration-300 hover:scale-110"
              aria-hidden="true"
            ></i>
          }
        </a>

        <button
          type="button"
          (click)="cart.toggle()"
          class="relative flex items-center justify-center rounded-sm cursor-pointer text-ink-2 hover:text-ink transition-colors"
          [attr.aria-label]="
            cart.itemCount() > 0 ? 'Apri carrello, ' + cart.itemCount() + ' articoli' : 'Apri carrello, vuoto'
          "
        >
          <i class="fa-solid fa-bag-shopping transition-transform duration-300 ease-out-expo hover:scale-110" aria-hidden="true"></i>
          @if (cart.itemCount() > 0) {
            <span
              class="absolute -top-2 -right-2.5 min-w-4 h-4 px-1 bg-ink text-surface text-[0.6rem] font-bold
                     rounded-full flex items-center justify-center leading-none tnum"
            >
              {{ cart.itemCount() > 9 ? '9+' : cart.itemCount() }}
            </span>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- ── Menu mobile ─────────────────────────────────────────────────────── -->
  @if (menuOpen()) {
    <div id="nav-mobile-menu" class="sm:hidden border-t border-line bg-surface">
      <div class="px-3 py-2">
        <a
          routerLink="/products"
          (click)="menuOpen.set(false)"
          routerLinkActive="text-ink"
          class="block px-2 py-3 text-sm font-semibold text-ink-2 hover:text-ink border-b border-line transition-colors"
          >Collezione</a
        >
        <a
          routerLink="/about"
          (click)="menuOpen.set(false)"
          routerLinkActive="text-ink"
          class="block px-2 py-3 text-sm font-semibold text-ink-2 hover:text-ink border-b border-line transition-colors"
          >Chi siamo</a
        >
        <a
          routerLink="/me"
          (click)="menuOpen.set(false)"
          routerLinkActive="text-ink"
          class="block px-2 py-3 text-sm font-semibold text-ink-2 hover:text-ink transition-colors"
          [class.border-b]="isAdmin()"
          [class.border-line]="isAdmin()"
          >Il mio account</a
        >
        @if (isAdmin()) {
          <a
            routerLink="/admin"
            (click)="menuOpen.set(false)"
            class="flex items-center gap-2 px-2 py-3 text-sm font-semibold text-ink transition-colors"
          >
            <i class="fa-solid fa-sliders text-xs" aria-hidden="true"></i>
            Pannello admin
          </a>
        }
      </div>
    </div>
  }
</nav>
