<nav class="flex flex-wrap items-center gap-1.5 text-xs text-ink-muted mb-5" aria-label="Breadcrumb">
  @for (item of items; track $index; let i = $index) {
    @if (i > 0) {
      <span class="text-line-strong" aria-hidden="true">/</span>
    }
    @if (!isLast(i) && item.link) {
      <a [routerLink]="item.link" class="hover:text-ink transition-colors">{{ item.label }}</a>
    } @else {
      <span class="text-ink font-semibold" aria-current="page">{{ item.label }}</span>
    }
  }
</nav>
