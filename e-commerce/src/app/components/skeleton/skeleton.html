@for (i of items(); track i) {
  @if (type === 'product-card') {
    <div class="flex flex-col gap-3">
      <div class="skeleton w-full aspect-[3/4]"></div>
      <div class="skeleton h-3.5 w-3/4"></div>
      <div class="skeleton h-3 w-1/3"></div>
    </div>
  } @else if (type === 'table-row') {
    <div class="flex items-center gap-4 py-3 border-b border-line">
      <div class="skeleton h-3.5 w-1/6"></div>
      <div class="skeleton h-3.5 flex-1"></div>
      <div class="skeleton h-3.5 w-1/5"></div>
      <div class="skeleton h-3.5 w-16"></div>
    </div>
  } @else if (type === 'circle') {
    <div class="skeleton w-10 h-10 rounded-full"></div>
  } @else {
    <div class="skeleton h-3.5 w-full mb-2"></div>
  }
}
