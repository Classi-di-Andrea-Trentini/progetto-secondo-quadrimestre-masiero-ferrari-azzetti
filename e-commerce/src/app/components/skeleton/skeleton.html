@for (i of items(); track i) {
  @if (type === 'product-card') {
    <div class="flex flex-col gap-3">
      <div class="w-full aspect-[3/4] bg-gray-200 rounded animate-pulse"></div>
      <div class="h-4 bg-gray-200 rounded animate-pulse w-3/4"></div>
      <div class="h-3 bg-gray-200 rounded animate-pulse w-1/2"></div>
    </div>
  } @else if (type === 'table-row') {
    <div class="flex items-center gap-4 py-3 border-b border-gray-100">
      <div class="h-4 bg-gray-200 rounded animate-pulse w-1/6"></div>
      <div class="h-4 bg-gray-200 rounded animate-pulse flex-1"></div>
      <div class="h-4 bg-gray-200 rounded animate-pulse w-1/5"></div>
      <div class="h-4 bg-gray-200 rounded animate-pulse w-1/8"></div>
    </div>
  } @else if (type === 'circle') {
    <div class="w-10 h-10 bg-gray-200 rounded-full animate-pulse"></div>
  } @else {
    <div class="h-4 bg-gray-200 rounded animate-pulse w-full mb-2"></div>
  }
}
