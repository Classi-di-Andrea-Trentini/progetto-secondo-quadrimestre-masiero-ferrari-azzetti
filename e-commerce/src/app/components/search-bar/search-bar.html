<div class="flex items-center gap-2 w-full max-w-md">
  <div class="relative flex-1">
    <svg
      class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-muted pointer-events-none"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
    </svg>
    <input
      type="search"
      class="field pl-9"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      (keyup)="onKeyUp($event)"
      placeholder="Cerca fra i capi…"
      aria-label="Cerca prodotti"
    />
  </div>
  <button type="button" (click)="search()" class="btn btn-primary shrink-0">Cerca</button>
</div>
