<div class="relative flex items-center w-full max-w-md">
  <div class="relative flex-1">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input
      type="text"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
      (keyup)="onKeyUp($event)"
      placeholder="Search products…"
      class="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-200 rounded-full bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white transition-all"
    />
  </div>
  <button
    (click)="search()"
    class="ml-2 px-4 py-2.5 bg-gray-900 text-white text-sm rounded-full hover:bg-gray-700 transition-colors flex-shrink-0"
  >
    Search
  </button>
</div>
