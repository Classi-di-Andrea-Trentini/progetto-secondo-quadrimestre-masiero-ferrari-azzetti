<div class="min-h-screen bg-[#F0F0F0] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <a routerLink="/home">
        <img src="commonEra.png" alt="Common Era" class="w-40 mx-auto mb-6" />
      </a>
      <h1 class="text-2xl font-['Cormorant_Garamond'] font-semibold tracking-widest uppercase">Nuova password</h1>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
      @if (done()) {
        <div class="text-center">
          <div class="w-14 h-14 bg-green-50 border border-green-200 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <h2 class="text-lg font-semibold text-gray-900 mb-2">Password aggiornata!</h2>
          <p class="text-sm text-gray-500">Verrai reindirizzato al login tra pochi secondi…</p>
        </div>
      } @else {
        @if (error()) {
          <div class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error() }}</div>
        }

        <form (ngSubmit)="submit()">
          <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Nuova password</label>
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              minlength="8"
              required
              placeholder="Almeno 8 caratteri"
              class="w-full border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black transition rounded-lg"
            />
          </div>

          <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Conferma password</label>
            <input
              [(ngModel)]="confirm"
              name="confirm"
              type="password"
              required
              placeholder="Ripeti la password"
              class="w-full border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-black transition rounded-lg"
            />
          </div>

          <button
            type="submit"
            [disabled]="loading()"
            class="w-full py-3 bg-black text-white text-sm font-semibold uppercase tracking-widest hover:bg-gray-800 transition disabled:opacity-50 rounded-lg"
          >
            @if (loading()) {
              <span class="inline-block w-4 h-4 border-2 border-gray-400 border-t-white rounded-full animate-spin"></span>
            } @else {
              Salva nuova password
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
