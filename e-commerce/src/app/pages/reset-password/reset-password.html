<div class="min-h-screen bg-paper flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <a routerLink="/home">
        <img src="commonEra.png" alt="Common Era" class="w-40 mx-auto mb-6" />
      </a>
      <h1 class="display text-3xl">Nuova password</h1>
    </div>

    <div class="panel p-8">
      @if (done()) {
        <div class="empty">
          <div class="w-14 h-14 bg-success-wash rounded-full flex items-center justify-center mb-2">
            <svg class="w-6 h-6 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <h2 class="empty-title">Password aggiornata</h2>
          <p class="empty-body">Verrai reindirizzato al login tra pochi secondi…</p>
        </div>
      } @else {
        @if (error()) {
          <div role="alert" class="mb-4 bg-danger-wash text-danger px-4 py-3 rounded-sm text-sm">
            {{ error() }}
          </div>
        }

        <form (ngSubmit)="submit()">
          <div class="mb-4">
            <label for="password" class="label">Nuova password</label>
            <input
              id="password"
              [(ngModel)]="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
              placeholder="Almeno 8 caratteri"
              class="field"
            />
          </div>

          <div class="mb-6">
            <label for="confirm" class="label">Conferma password</label>
            <input
              id="confirm"
              [(ngModel)]="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Ripeti la password"
              class="field"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg btn-block"
            [attr.data-loading]="loading() ? 'true' : null"
          >
            {{ loading() ? 'Salvataggio in corso' : 'Salva nuova password' }}
          </button>
        </form>
      }
    </div>
  </div>
</div>
