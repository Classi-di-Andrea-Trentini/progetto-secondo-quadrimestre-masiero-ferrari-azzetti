<div class="min-h-screen bg-paper flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <a routerLink="/home">
        <img src="commonEra.png" alt="Common Era" class="w-40 mx-auto mb-6" />
      </a>
      <h1 class="text-2xl font-display font-semibold tracking-widest uppercase">Nuova password</h1>
    </div>

    <div class="bg-surface border border-line rounded-sm p-8 shadow-sm">
      @if (done()) {
        <div class="text-center">
          <div class="w-14 h-14 bg-success-wash border border-transparent rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <h2 class="text-lg font-semibold text-ink mb-2">Password aggiornata!</h2>
          <p class="text-sm text-ink-muted">Verrai reindirizzato al login tra pochi secondi…</p>
        </div>
      } @else {
        @if (error()) {
          <div class="mb-4 bg-danger-wash text-danger px-4 py-3 rounded-sm text-sm">{{ error() }}</div>
        }

        <form (ngSubmit)="submit()">
          <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-widest text-ink-muted mb-2">Nuova password</label>
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              minlength="8"
              required
              placeholder="Almeno 8 caratteri"
              class="field rounded-sm"
            />
          </div>

          <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-widest text-ink-muted mb-2">Conferma password</label>
            <input
              [(ngModel)]="confirm"
              name="confirm"
              type="password"
              required
              placeholder="Ripeti la password"
              class="field rounded-sm"
            />
          </div>

          <button
            type="submit"
            [disabled]="loading()"
            class="w-full py-3 bg-black text-white text-sm font-semibold uppercase tracking-widest hover:bg-ink-strong transition disabled:opacity-50 rounded-sm"
          >
            @if (loading()) {
              <span class="inline-block w-4 h-4 border-2 border-line-strong border-t-white rounded-full animate-spin"></span>
            } @else {
              Salva nuova password
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
