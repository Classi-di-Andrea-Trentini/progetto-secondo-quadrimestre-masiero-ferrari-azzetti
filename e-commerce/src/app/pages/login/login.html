<div class="min-h-screen flex items-center justify-center px-4 py-16 bg-paper">
  <div class="w-full max-w-sm">

    <div class="mb-10 text-center">
      <h1 class="display text-3xl">Accedi</h1>
      <p class="mt-2 text-sm text-ink-muted">
        Non hai un account?
        <a routerLink="/register" class="link">Registrati</a>
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

      <div>
        <label for="email" class="label">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="nome@esempio.it"
          class="field"
          [attr.aria-invalid]="email.invalid && email.touched ? 'true' : null"
          [attr.aria-describedby]="email.invalid && email.touched ? 'email-error' : null"
        />
        @if (email.invalid && email.touched) {
          <p id="email-error" class="field-error">Inserisci un indirizzo email valido</p>
        }
      </div>

      <div>
        <label for="password" class="label">Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="field pr-24"
            [attr.aria-invalid]="password.invalid && password.touched ? 'true' : null"
            [attr.aria-describedby]="password.invalid && password.touched ? 'password-error' : null"
          />
          <!-- Il toggle vive dentro il campo: btn-ghost btn-sm, non un bottone ricostruito a mano. -->
          <button
            type="button"
            class="btn btn-ghost btn-sm absolute inset-y-0 right-0"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'"
            (click)="togglePasswordVisibility()"
          >
            {{ showPassword() ? 'Nascondi' : 'Mostra' }}
          </button>
        </div>
        @if (password.invalid && password.touched) {
          <p id="password-error" class="field-error">La password deve essere di almeno 8 caratteri</p>
        }
      </div>

      @if (error()) {
        <div role="alert" class="bg-danger-wash text-danger px-4 py-3 rounded-sm text-sm">
          {{ error() }}
        </div>
      }

      <div class="flex justify-end">
        <a routerLink="/forgot-password" class="text-xs text-ink-muted hover:text-ink transition">
          Password dimenticata?
        </a>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg btn-block"
        [attr.data-loading]="loading() ? 'true' : null"
      >
        {{ loading() ? 'Accesso in corso' : 'Accedi' }}
      </button>

    </form>
  </div>
</div>
