# Intestazioni di sicurezza, in un posto solo.
#
# Incluse UNA volta sola, a livello di `server`. In nginx `add_header` non si
# somma fra livelli: se anche un solo `location` ne dichiarasse uno proprio,
# quel `location` perderebbe *tutte* le intestazioni ereditate da qui. E' il modo
# piu' comune di ritrovarsi con un sito protetto ovunque tranne che sulla pagina
# che conta.
#
# `always` su tutte: senza, nginx le aggiunge solo alle risposte 2xx/3xx. Una
# pagina di errore 404 o 500 e' HTML servito al browser esattamente come le
# altre, e senza CSP e' proprio il posto dove un messaggio d'errore che rimanda
# indietro l'input dell'utente diventa una XSS.

# ─── Trasporto ────────────────────────────────────────────────────────────────
# Due anni. Dice al browser di non provare nemmeno a contattarci in http: toglie
# di mezzo il primo salto in chiaro, quello che un attaccante sulla stessa rete
# usa per lo strip di TLS. Il redirect 80 -> 443 da solo non basta, perche' e'
# proprio quella prima richiesta in chiaro a essere intercettabile.
#
# Niente `preload`: iscriversi alla lista precaricata dei browser e' una
# decisione quasi irreversibile (la rimozione richiede mesi) e vale per TUTTI i
# sottodomini, compresi quelli che un domani potrebbero servire in http.
# Va aggiunto a mano quando il dominio e' definitivo e il certificato si rinnova
# da solo da qualche mese.
#
# ATTENZIONE in locale: con il certificato autofirmato questa riga insegna al tuo
# browser che `localhost` e' solo-https, e resta valida per due anni anche dopo
# aver spento lo stack. Per ripulire: chrome://net-internals/#hsts -> "Delete
# domain security policies" -> localhost.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ─── Tipi e contenuti ─────────────────────────────────────────────────────────
# Vieta al browser di indovinare il tipo di un file ignorando il Content-Type.
# Concretamente: una foto prodotto caricata da un admin e servita sotto
# /api/uploads/ non puo' essere interpretata come JavaScript perche' il contenuto
# "sembra" uno script.
add_header X-Content-Type-Options "nosniff" always;

# Nessuno puo' mettere il sito dentro un iframe: e' la difesa dal clickjacking,
# cioe' dal sito che ci sovrappone un bottone invisibile sopra "Conferma ordine".
# Duplicata piu' sotto in forma moderna con `frame-ancestors`, che X-Frame-Options
# rimpiazza nei browser aggiornati; la teniamo per quelli che non leggono la CSP.
# Non ha effetto sugli iframe che siamo NOI a includere (quelli di Stripe): quelli
# li governa `frame-src`.
add_header X-Frame-Options "DENY" always;

# Ai siti esterni arriva solo l'origine, non il percorso. Senza, uscendo da
# /order/confirm/<id-ordine> verso un link esterno l'intero URL — identificativo
# dell'ordine compreso — finisce nei log del sito di destinazione.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nessuna di queste tre funzioni serve a un negozio di abbigliamento. Chiederle
# esplicitamente spente vuol dire che uno script di terze parti compromesso non
# puo' nemmeno provare a far comparire la richiesta di permesso.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ─── Content Security Policy ──────────────────────────────────────────────────
#
# Ogni sorgente qui sotto e' presente perche' una pagina reale del sito la
# carica. L'elenco e' stato ricavato da src/index.html, da ngsw-config.json e
# dalla documentazione di Stripe, non a intuito: una direttiva troppo stretta non
# rompe la build ne' i test, rompe il browser dell'utente in silenzio.
#
#   default-src 'self'
#       Rete di sicurezza: tutto cio' che non ha una direttiva propria puo'
#       arrivare solo dalla nostra origine.
#
#   script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net
#       - js.stripe.com: Stripe Elements. Stripe **impone** che stripe.js sia
#         caricato dal loro dominio a ogni caricamento di pagina, perche' e' cosi'
#         che aggiornano l'antifrode; ospitarne una copia invalida la conformita'
#         PCI SAQ-A. Senza questa voce il modulo carta non compare affatto e in
#         console resta solo un errore di CSP: il checkout smette di funzionare
#         senza che nulla vada in errore lato server.
#       - cdn.jsdelivr.net: Chart.js, caricato da index.html per i grafici del
#         pannello di amministrazione.
#       - 'unsafe-inline': lo impone Angular, non una nostra scelta.
#         `provideClientHydration(withEventReplay())` (src/app/app.config.ts) fa
#         emettere al rendering lato server uno `<script>` in linea che riproduce
#         i click avvenuti prima che l'app sia idratata. Toglierlo qui significa
#         che i primi click dell'utente vengono persi. L'alternativa pulita e' un
#         nonce per richiesta, che pero' deve nascere in nginx e finire dentro
#         l'HTML generato da Angular: e' un lavoro suo, da fare nel frontend
#         (attributo `ngCspNonce`), non un interruttore di questo file.
#         Nota: 'unsafe-inline' non copre `eval`, che resta vietato — non c'e'
#         nessun 'unsafe-eval' qui sotto, ed e' voluto.
#
#   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com
#       Angular scrive gli stili dei componenti come `<style>` in linea nella
#       pagina renderizzata lato server: senza 'unsafe-inline' il sito arriva
#       completamente senza stile. fonts.googleapis.com e cdnjs servono i due CSS
#       esterni dichiarati in index.html (i font del sito e Font Awesome).
#
#   font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:
#       I file dei font veri: Google li serve da gstatic (dominio diverso da
#       quello del CSS), Font Awesome dal proprio CDN. `data:` perche' qualche
#       icona arriva incorporata nel CSS.
#
#   img-src 'self' data: blob: https://*.stripe.com
#       `data:` e `blob:` per le anteprime delle foto prodotto generate nel
#       browser prima del caricamento. Il sottodominio di Stripe serve ai loghi
#       dei circuiti di pagamento dentro Elements.
#
#   connect-src 'self' https://api.stripe.com
#       Le nostre chiamate XHR sono tutte same-origin (il frontend chiama /api,
#       vedi services/api.config.ts). api.stripe.com e' la chiamata che Stripe
#       Elements fa da solo per creare il metodo di pagamento: senza, la carta
#       viene rifiutata con un errore di rete generico.
#
#   frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network
#       I campi della carta NON sono campi nostri: sono iframe di Stripe, ed e'
#       tutto il motivo per cui i dati della carta non passano mai dai nostri
#       server. js.stripe.com e' il modulo, hooks.stripe.com la finestra di
#       autenticazione 3D Secure, m.stripe.network l'iframe nascosto che raccoglie
#       i segnali antifrode. Mancando anche solo hooks.stripe.com, i pagamenti
#       normali funzionano e falliscono **solo** quelli che richiedono 3D Secure,
#       cioe' quasi tutti quelli europei: il caso peggiore, perche' in prova non
#       si vede.
#
#   frame-ancestors 'none'  -> equivalente moderno di X-Frame-Options: DENY.
#   base-uri 'self'         -> impedisce a una <base> iniettata di dirottare ogni
#                              URL relativo della pagina verso un altro dominio.
#   form-action 'self'      -> un form iniettato non puo' spedire altrove i dati.
#   object-src 'none'       -> niente Flash/plugin: solo superficie d'attacco.
#   worker-src 'self' blob: -> il service worker (ngsw-worker.js) rende il sito
#                              installabile e apribile offline.
#   manifest-src 'self'     -> manifest.webmanifest, per lo stesso motivo.
#   upgrade-insecure-requests -> se una risorsa sfugge con http://, il browser la
#                              chiede in https invece di bloccarla e basta.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://*.stripe.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
