# Intestazioni comuni a ogni `proxy_pass` di questo sito.
#
# Perche' un file a parte: frontend e backend stanno dietro allo stesso nginx e
# devono ricevere *esattamente* le stesse informazioni sulla richiesta originale.
# Con le righe duplicate in due `location` diversi basta aggiornarne uno solo per
# ritrovarsi con un backend che vede il client giusto e un frontend che no.

proxy_http_version 1.1;

# `Host` originale: il backend costruisce da qui i link assoluti delle email
# (conferma indirizzo, reimposta password). Passando l'host dell'upstream
# ("backend:3000") quelle email arriverebbero con un link irraggiungibile.
proxy_set_header Host              $host;

# L'indirizzo vero del client: senza queste due righe ogni richiesta risulta
# provenire dall'IP di nginx, e qualunque cosa a monte voglia distinguere un
# utente dall'altro (log, limiti, diagnostica) vede un solo indirizzo per tutti.
#
# `$remote_addr` e non `$proxy_add_x_forwarded_for`, che e' il valore piu' visto
# negli esempi: quest'ultimo **accoda** l'IP visto da nginx a quanto ha mandato il
# client, quindi un client puo' scriversi da solo il primo indirizzo della lista.
# Se un giorno qualcosa a monte leggesse il primo elemento — e' la lettura
# naturale — l'indirizzo sarebbe falsificabile. Qui il salto di proxy e' esattamente
# uno, nginx, quindi l'unico valore giusto e' quello che nginx vede coi propri
# occhi, e ogni intestazione arrivata da fuori va sovrascritta, non estesa.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;

# Lo schema esterno resta https anche se il salto verso l'upstream e' in chiaro
# sulla rete interna. Senza queste righe Spring costruisce URL `http://` dentro
# un sito servito in `https://`, e il browser blocca il contenuto misto.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Nessuna bufferizzazione della richiesta: il caricamento delle foto prodotto e'
# multipart e arriva a qualche megabyte. Bufferizzarlo su disco dentro nginx
# prima di inoltrarlo aggiunge solo latenza e scritture inutili.
proxy_request_buffering off;

# Il salto nginx -> upstream avviene sulla rete interna di Compose, quindi i
# tempi sono quelli dell'applicazione, non della rete. Sessanta secondi coprono
# il rendering lato server di una pagina fredda; oltre, e' un guasto, e tenere la
# connessione aperta non lo risolve.
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Le intestazioni di sicurezza le decide nginx (vedi security-headers.conf).
# Spring Security ne manda di proprie: senza queste righe il browser riceverebbe
# due `X-Frame-Options` e due `X-Content-Type-Options` per ogni risposta sotto
# /api, e a fronte di valori in conflitto il comportamento cambia da browser a
# browser.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;
